name: Build and Push OCI Image (internal)

# Forgejo-only build pipeline.  Lives at .forgejo/workflows/ so
# GitHub Actions ignores it (GitHub only reads .github/workflows/).
# the Forgejo runner discovers this workflow and dispatches it on
# manual trigger.
#
# Why a separate Forgejo workflow when GHCR already has the image:
# we want the same image available from the in-house OCI registry at
# scm.ird-cloud.de so consumers don't depend on GHCR being reachable.
# The image content is identical; only the storage location differs.
#
# Trigger is workflow_dispatch only.  Auto-rebuild on every push to
# main would double-bake (GitHub already rebuilds via
# .github/workflows/build-image.yml).  When upstream GHCR has a new
# tag, run this manually to refresh the internal registry.
#
# Build substrate — docker against the dind sidecar (NOT buildah):
# the runner pod ships a privileged `docker:dind` sidecar reachable at
# DOCKER_HOST=tcp://localhost:2375 (k8s/templates/forgejo.yaml).  We
# build by shipping the Containerfile to that daemon.  buildah broke
# here because the heavy arm64 sysroot extraction is a build-time RUN
# (Containerfile `debootstrap` step): its chroot-exec of aarch64
# binaries needs binfmt_misc, but buildah's per-RUN unshare(CLONE_NEWUSER)
# under nested k3s namespacing doesn't inherit the host registration.
# dind sets up its namespaces once at daemon startup, so binfmt
# registered at the daemon level (via tonistiigi/binfmt) is visible to
# every RUN — including the debootstrap chroot.  Hence: register qemu
# BEFORE `docker build`.

on:
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.PUBLISH_HOST }}
  IMAGE_NAME: ${{ vars.PUBLISH_ORG }}/cross-build-trixie-arm64
  # NB: DOCKER_HOST is NOT a static tcp://localhost:2375 — the runner label
  # ubuntu-24.04:docker://node:20-bookworm runs every job inside a container on
  # act_runner's own per-job network, where localhost is NOT the dind sidecar.
  # The first step derives the dind daemon's address from the default gateway
  # and exports DOCKER_HOST for the rest of the job.
  # Match consumer release.yml — opt JS actions (checkout/cache/upload)
  # into Node.js 24, removing the deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    # The job runs inside node:20-bookworm (the runner label's container); the
    # first step installs the docker CLI and points DOCKER_HOST at the dind
    # daemon via the default gateway. The build is shipped to that daemon.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install docker CLI + reach the dind daemon
        shell: bash
        # The job runs inside a node:20-bookworm container on act_runner's
        # per-job network, so the dind sidecar is NOT at localhost. Install the
        # docker client (node:20-bookworm has node but not docker), then point
        # DOCKER_HOST at the job's default-route gateway (the docker bridge
        # gateway lives in the dind/pod netns where 2375 listens). Export it via
        # $GITHUB_ENV so binfmt/login/build/push all use it.
        run: |
          set -eux
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends docker.io ca-certificates
          fi
          G=$(awk '$2=="00000000"{print $3; exit}' /proc/net/route)
          printf -v GWIP "%d.%d.%d.%d" "0x${G:6:2}" "0x${G:4:2}" "0x${G:2:2}" "0x${G:0:2}"
          echo "DOCKER_HOST=tcp://${GWIP}:2375" >> "$GITHUB_ENV"
          export DOCKER_HOST="tcp://${GWIP}:2375"
          echo "using DOCKER_HOST=$DOCKER_HOST"
          for i in $(seq 1 15); do docker version && break; echo "waiting for dind ($i)..."; sleep 2; done
          docker version

      - name: Register qemu-aarch64 binfmt handlers (on the dind daemon)
        # The Containerfile's `debootstrap --arch=arm64` step (and the
        # arch sanity RUNs after it) chroot into the freshly-extracted
        # sysroot and execute aarch64 binaries via qemu-user binfmt_misc.
        # GitHub-hosted runners get these handlers for free; the dind
        # daemon does not.  Running tonistiigi/binfmt --privileged
        # registers them at the daemon level (this is exactly what
        # docker/setup-qemu-action wraps).  MUST run before `docker build`
        # because the heavy sysroot extraction is a build-time RUN.
        run: |
          set -eux
          docker run --rm --privileged tonistiigi/binfmt --install arm64
          # Print the table so the log shows `arm64` as an emulated arch.
          docker run --rm --privileged tonistiigi/binfmt

      - name: Log in to ${{ env.REGISTRY }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_HOST: ${{ vars.PUBLISH_HOST }}
          PUBLISH_USER: ${{ vars.PUBLISH_USER }}
        run: |
          set -eu
          : "${PUBLISH_TOKEN:?PUBLISH_TOKEN must be set as an org-level secret}"
          echo "$PUBLISH_TOKEN" | \
              docker login \
                  --username "$PUBLISH_USER" \
                  --password-stdin \
                  "$REGISTRY"

      - name: Build OCI image
        run: |
          set -eux
          # Ship the build to the dind daemon.  binfmt was registered at
          # the daemon level in the previous step, so the debootstrap RUN
          # resolves its aarch64 chroot-exec via qemu-user — no per-RUN
          # CLONE_NEWUSER / exec-format-error that broke buildah here.
          docker build \
              -t "${REGISTRY}/${IMAGE_NAME}:build" \
              -f Containerfile \
              .

      - name: Smoke test
        run: |
          set -eu
          IMG="${REGISTRY}/${IMAGE_NAME}:build"
          echo "=== Node (the reason we patched the image) ==="
          docker run --rm "$IMG" node --version
          echo "=== Cross-compiler ==="
          docker run --rm "$IMG" aarch64-linux-gnu-g++-14 --version | head -1
          echo "=== CMake ==="
          docker run --rm "$IMG" cmake --version | head -1
          echo "=== Sysroot glibc (runtime libc.so.6 path) ==="
          docker run --rm "$IMG" \
              ls -la /opt/trixie-arm64-sysroot/usr/lib/aarch64-linux-gnu/libc.so.6

      - name: Determine tags + push
        run: |
          set -eux
          IMG="${REGISTRY}/${IMAGE_NAME}"
          # Always push :latest.  Add a dated tag for reproducibility,
          # and the semver tag when the run was dispatched on a v* ref.
          TAGS="latest $(date +%Y%m%d)"
          REF="${GITHUB_REF##*/}"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              TAGS="${TAGS} ${REF#v}"
          fi
          for t in $TAGS; do
              docker tag "${IMG}:build" "${IMG}:${t}"
              docker push "${IMG}:${t}"
              echo "pushed ${IMG}:${t}"
          done
