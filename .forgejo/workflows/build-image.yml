name: Build and Push OCI Image (internal)

# Forgejo-only build pipeline.  Lives at .forgejo/workflows/ so
# GitHub Actions ignores it (GitHub only reads .github/workflows/).
# the Forgejo runner discovers this workflow and dispatches it on
# manual trigger.
#
# Why a separate Forgejo workflow when GHCR already has the image:
# we want the same image available from the in-house OCI registry at
# consumers don't depend on GHCR being reachable.  The image content
# is identical; only the storage location differs.
#
# Trigger is workflow_dispatch only.  Auto-rebuild on every push to
# main would double-bake (GitHub already rebuilds via
# .github/workflows/build-image.yml).  When upstream GHCR has a new
# tag, run this manually to refresh the internal registry.

on:
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.PUBLISH_HOST }}
  IMAGE_NAME: ${{ vars.PUBLISH_ORG }}/cross-build-trixie-arm64
  # Match consumer release.yml — opt JS actions (checkout/cache/upload)
  # into Node.js 24, removing the deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    # No `container:` — we run in the runner's host image (node:20-bookworm),
    # which has node for actions/checkout.  Bookworm has buildah in apt.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install buildah
        run: |
          set -eux
          apt-get update
          # `crun` is the OCI runtime buildah shells out to for every RUN
          # step.  On Debian it's `Recommends: crun | runc`, so
          # --no-install-recommends drops it and buildah fails with
          # `exec: no command` on the first RUN.  Pull it in explicitly.
          apt-get install -y --no-install-recommends \
              buildah \
              crun \
              fuse-overlayfs \
              ca-certificates
          buildah version
          crun --version

      - name: Register qemu-aarch64-static binfmt handlers
        # debootstrap inside the build chroots into the freshly-extracted
        # arm64 sysroot and runs aarch64 binaries (e.g. `/bin/true`) via
        # qemu-user binfmt_misc.  GitHub-hosted runners get those handlers
        # for free; self-hosted Forgejo runners don't.  tonistiigi/binfmt
        # installs them in one shot (`docker/setup-qemu-action` upstream
        # is just a wrapper around this same image).
        #
        # `buildah run` doesn't honour the image's ENTRYPOINT, so we have
        # to name the entrypoint binary explicitly (`/usr/bin/binfmt`);
        # the `--install arm64` args go to that binary.
        run: |
          set -eux
          buildah pull docker.io/tonistiigi/binfmt:latest
          CTR=$(buildah from docker.io/tonistiigi/binfmt:latest)
          buildah run \
              --cap-add ALL \
              --net host \
              -v /proc/sys/fs/binfmt_misc:/proc/sys/fs/binfmt_misc \
              "$CTR" \
              /usr/bin/binfmt --install arm64
          buildah rm "$CTR"
          # tonistiigi/binfmt prints "installing: arm64 OK" + a JSON list
          # of registered emulators on success.  We don't try to verify by
          # listing /proc/sys/fs/binfmt_misc/ ourselves — the runner
          # container's view of that pseudo-fs differs from the host's
          # (where the registration actually lives), and the bind-mount
          # we passed to the binfmt container is one-way for write.

      - name: Log in to ${{ env.REGISTRY }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_HOST: ${{ vars.PUBLISH_HOST }}
          PUBLISH_USER: ${{ vars.PUBLISH_USER }}
        run: |
          set -eu
          : "${PUBLISH_TOKEN:?PUBLISH_TOKEN must be set as an org-level secret}"
          echo "$PUBLISH_TOKEN" | \
              buildah login --tls-verify=true \
                            --username ${{ vars.PUBLISH_USER }} \
                            --password-stdin \
                            "${{ env.REGISTRY }}"

      - name: Build OCI image
        run: |
          set -eux
          buildah bud \
              --format oci \
              --layers \
              --cap-add SYS_ADMIN \
              -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build" \
              -f Containerfile \
              .

      - name: Smoke test
        run: |
          set -eu
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build"
          CTR=$(buildah from "$IMG")
          echo "=== Node (the reason we patched the image) ==="
          buildah run "$CTR" -- node --version
          echo "=== Compiler ==="
          buildah run "$CTR" -- aarch64-linux-gnu-g++-14 --version | head -1
          echo "=== CMake ==="
          buildah run "$CTR" -- cmake --version | head -1
          buildah rm "$CTR"

      - name: Determine tags + push
        run: |
          set -eux
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          # Always push :latest from main.  Tag pushes (v*) get the
          # tag too — caller can re-trigger after upstream tags.
          TAGS="latest"
          REF="${GITHUB_REF##*/}"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              TAGS="${TAGS} ${REF}"
          fi
          for t in $TAGS; do
              buildah tag "${IMG}:build" "${IMG}:${t}"
              buildah push --tls-verify=true "${IMG}:${t}"
              echo "✓ pushed ${IMG}:${t}"
          done
