name: Build and Push OCI Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Rebuild monthly to pick up security updates in the base image
    - cron: '0 4 1 * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Opt JavaScript actions (actions/checkout, docker/setup-qemu-action,
  # …) into Node.js 24 ahead of GitHub's June 2026 forced switch.
  # Removes the "Node.js 20 actions are deprecated" warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            buildah login -u "${{ github.actor }}" --password-stdin ghcr.io

      - name: Build OCI image
        run: |
          buildah bud \
            --format oci \
            --layers \
            --cap-add SYS_ADMIN \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build \
            -f Containerfile \
            .

      - name: Smoke test
        run: |
          CTR=$(buildah from ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build)

          echo "=== Compiler versions ==="
          buildah run "$CTR" aarch64-linux-gnu-g++-14 --version

          echo "=== Sysroot glibc ==="
          buildah run "$CTR" \
            ls -la /opt/trixie-arm64-sysroot/usr/lib/aarch64-linux-gnu/libc.so.6

          echo "=== CMake version ==="
          buildah run "$CTR" cmake --version

          echo "=== Cross-compile + QEMU run test ==="
          buildah run "$CTR" \
            sh -c 'echo "#include <format>\n#include <print>\nint main() { std::println(\"{}\", 42); }" > /tmp/test.cpp && aarch64-linux-gnu-g++-14 -std=c++23 --sysroot=/opt/trixie-arm64-sysroot -o /tmp/test /tmp/test.cpp && file /tmp/test && qemu-aarch64-static /tmp/test'

          echo "=== Sysroot gRPC / protobuf / runtime deps (Trixie aarch64) ==="
          buildah run "$CTR" \
            sh -c 'ls -1 /opt/trixie-arm64-sysroot/usr/lib/aarch64-linux-gnu/ | grep -E "^(libgrpc\+\+|libgrpc|libprotobuf|libabsl|libupb|libcares|libre2|libssl|libcrypto|libsystemd|libz)\." | sort'
          buildah run "$CTR" \
            sh -c 'dpkg --root=/opt/trixie-arm64-sysroot -l | grep -E "libgrpc|libprotobuf|libabsl|libupb|libcares|libre2|libssl|libsystemd|zlib" || true'

          buildah rm "$CTR"

      - name: Determine tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          fi
          # Also tag with date for reproducibility
          TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$(date +%Y%m%d)"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Tag and push
        if: github.event_name != 'pull_request'
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            buildah tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build "$tag"
            buildah push "$tag"
          done

      - name: Summary
        run: |
          echo "### OCI Image Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | \`${{ steps.tags.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Pushed | \`${{ github.event_name != 'pull_request' }}\` |" >> $GITHUB_STEP_SUMMARY
